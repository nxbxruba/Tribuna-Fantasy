<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>InfoFut Fantasy</title>
  <meta name="description" content="Resultados en directo, clasificaciones, posibles alineaciones, fichajes y Fantasy de LaLiga.">
  <meta name="theme-color" content="#0a8f4e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="iconos/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="InfoFut">
  <link rel="stylesheet" href="estilos.css">
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeos
    try { var t = JSON.parse(localStorage.getItem('ft.tema')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="cabecera">
    <div class="contenedor cabecera-fila">
      <button class="boton-icono hamburguesa" type="button" id="abrir-menu" aria-label="Abrir menú" aria-controls="cajon" aria-expanded="false"><span></span></button>
      <a class="marca" href="#/"><img class="logo" src="iconos/logo.svg" alt="" width="30" height="30">InfoFut <span>Fantasy</span></a>
      <nav class="menu" aria-label="Menú principal">
        <a href="#/" data-seccion="inicio"><span class="menu-icono">🏠</span><span>Inicio</span></a>
        <a href="#/noticias" data-seccion="noticias"><span class="menu-icono">📰</span><span>Noticias</span></a>
        <a href="#/fantasy" data-seccion="fantasy"><span class="menu-icono">💰</span><span>Fantasy</span></a>
        <a href="#/fichajes" data-seccion="fichajes"><span class="menu-icono">🔄</span><span>Fichajes</span></a>
      </nav>
      <a class="boton-icono" href="#/buscar" aria-label="Buscar">🔍</a>
    </div>
  </header>

  <div class="velo" id="velo"></div>
  <aside class="cajon" id="cajon" aria-label="Menú"></aside>

  <main class="contenedor" id="app" aria-live="polite"></main>

  <footer class="pie contenedor">
    <p>Datos: ESPN (partidos y noticias), LaLiga Fantasy (precios), Futbol Fantasy (alineaciones probables) y Transfermarkt (fichajes). Proyecto personal sin afiliación con ligas ni clubes.</p>
  </footer>

  <div class="aviso-toast" id="toast" role="status"></div>

  <!-- Datos descargados con "Actualizar datos.bat" (o automáticamente por GitHub Actions) -->
  <script src="datos/fantasy.js"></script>
  <script src="datos/alineaciones.js"></script>
  <script src="datos/fichajes.js"></script>

  <script src="js/nucleo.js"></script>
  <script src="js/partidos.js"></script>
  <script src="js/posible-once.js"></script>
  <script src="js/ligas.js"></script>
  <script src="js/fantasy.js"></script>
  <script src="js/fichajes.js"></script>
  <script src="js/buscar.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
